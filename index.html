<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Lucide icons as inline SVG components
        const Dumbbell = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 12h16M4 12a2 2 0 01-2-2V8a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2m12 0a2 2 0 002 2h2a2 2 0 002-2V8a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2z" />
            </svg>
        );
        
        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );
        
        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );
        
        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );
        
        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        function WorkoutTracker() {
            const [workouts, setWorkouts] = useState([]);
            const [exercise, setExercise] = useState('');
            const [sets, setSets] = useState('');
            const [reps, setReps] = useState('');
            const [weight, setWeight] = useState('');
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                loadWorkouts();
            }, []);

            const loadWorkouts = async () => {
                try {
                    const result = await window.storage.get('workout-history');
                    if (result && result.value) {
                        setWorkouts(JSON.parse(result.value));
                    }
                } catch (error) {
                    console.log('No previous workouts found');
                } finally {
                    setLoading(false);
                }
            };

            const saveWorkouts = async (updatedWorkouts) => {
                setSaving(true);
                try {
                    await window.storage.set('workout-history', JSON.stringify(updatedWorkouts));
                } catch (error) {
                    alert('Failed to save workout: ' + error.message);
                } finally {
                    setSaving(false);
                }
            };

            const addWorkout = async () => {
                if (!exercise || !sets || !reps) return;

                const newWorkout = {
                    id: Date.now(),
                    exercise,
                    sets: parseInt(sets),
                    reps: parseInt(reps),
                    weight: weight ? parseFloat(weight) : null,
                    date: new Date().toISOString()
                };

                const updatedWorkouts = [newWorkout, ...workouts];
                setWorkouts(updatedWorkouts);
                await saveWorkouts(updatedWorkouts);

                setExercise('');
                setSets('');
                setReps('');
                setWeight('');
            };

            const deleteWorkout = async (id) => {
                const updatedWorkouts = workouts.filter(w => w.id !== id);
                setWorkouts(updatedWorkouts);
                await saveWorkouts(updatedWorkouts);
            };

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            const getExerciseStats = (exerciseName) => {
                const exerciseWorkouts = workouts.filter(w => 
                    w.exercise.toLowerCase() === exerciseName.toLowerCase()
                );
                return exerciseWorkouts.length;
            };

            const uniqueExercises = [...new Set(workouts.map(w => w.exercise))];

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-xl text-gray-600">Loading workouts...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center gap-2 mb-2">
                                <Dumbbell className="w-10 h-10 text-indigo-600" />
                                <h1 className="text-4xl font-bold text-gray-800">Workout Tracker</h1>
                            </div>
                            <p className="text-gray-600">Track your fitness journey</p>
                        </div>

                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 className="text-2xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                                <Plus className="w-6 h-6" />
                                Log New Workout
                            </h2>
                            <div className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Exercise
                                        </label>
                                        <input
                                            type="text"
                                            value={exercise}
                                            onChange={(e) => setExercise(e.target.value)}
                                            placeholder="e.g., Bench Press"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Weight (lbs/kg) - Optional
                                        </label>
                                        <input
                                            type="number"
                                            step="0.5"
                                            value={weight}
                                            onChange={(e) => setWeight(e.target.value)}
                                            placeholder="e.g., 135"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Sets
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            value={sets}
                                            onChange={(e) => setSets(e.target.value)}
                                            placeholder="e.g., 3"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Reps
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            value={reps}
                                            onChange={(e) => setReps(e.target.value)}
                                            placeholder="e.g., 10"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>
                                <button
                                    onClick={addWorkout}
                                    disabled={saving || !exercise || !sets || !reps}
                                    className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                                >
                                    {saving ? 'Saving...' : 'Add Workout'}
                                </button>
                            </div>
                        </div>

                        {uniqueExercises.length > 0 && (
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h2 className="text-2xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                                    <TrendingUp className="w-6 h-6" />
                                    Exercise Summary
                                </h2>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {uniqueExercises.map(ex => (
                                        <div key={ex} className="bg-indigo-50 rounded-lg p-4">
                                            <div className="font-semibold text-gray-800">{ex}</div>
                                            <div className="text-2xl font-bold text-indigo-600">
                                                {getExerciseStats(ex)}
                                            </div>
                                            <div className="text-sm text-gray-600">sessions</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-lg shadow-lg p-6">
                            <h2 className="text-2xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                                <Calendar className="w-6 h-6" />
                                Workout History ({workouts.length})
                            </h2>
                            
                            {workouts.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <Dumbbell className="w-16 h-16 mx-auto mb-4 opacity-50" />
                                    <p className="text-lg">No workouts logged yet.</p>
                                    <p>Start tracking your progress above!</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {workouts.map(workout => (
                                        <div
                                            key={workout.id}
                                            className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow"
                                        >
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1">
                                                    <h3 className="text-lg font-semibold text-gray-800">
                                                        {workout.exercise}
                                                    </h3>
                                                    <div className="text-gray-600 mt-1">
                                                        <span className="font-medium">{workout.sets}</span> sets × {' '}
                                                        <span className="font-medium">{workout.reps}</span> reps
                                                        {workout.weight && (
                                                            <span> @ <span className="font-medium">{workout.weight}</span> lbs</span>
                                                        )}
                                                    </div>
                                                    <div className="text-sm text-gray-500 mt-2">
                                                        {formatDate(workout.date)}
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => deleteWorkout(workout.id)}
                                                    className="text-red-500 hover:text-red-700 p-2"
                                                    title="Delete workout"
                                                >
                                                    <Trash2 className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-6 text-center text-sm text-gray-600">
                            <p>💾 Your workouts are saved automatically and persist across sessions</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<WorkoutTracker />, document.getElementById('root'));
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
